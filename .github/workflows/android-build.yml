name: Build Android AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies (SDL2 + Android)
        run: |
          sudo apt update
          sudo apt install -y \
            zip unzip git \
            openjdk-17-jdk \
            python3-pip \
            build-essential \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libjpeg-dev \
            libpng-dev

      - name: Install Buildozer and Python tools
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Clean previous build artifacts
        run: |
          buildozer android clean || true

      - name: Build Android AAB
        run: |
          buildozer android release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: irispics-aab
          path: bin/*.aab
