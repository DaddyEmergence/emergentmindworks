[app]
title = IRIS Pics
package.name = irispics
package.domain = org.emergentmindworks

source.dir = .
source.include_exts = py

version = 0.1

requirements = python3,kivy,pillow

orientation = portrait
fullscreen = 0

entrypoint = python3
entrypoint.args = pics.py

[buildozer]
log_level = 2
warn_on_root = 1
